<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDG Bursa Astronomik Çekiliş</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #05070f;
        --bg-2: #02030a;
        --cyan: #00ffff;
        --gold: #ffd700;
        --danger: #ff2b2b;
        --panel: rgba(6, 20, 40, 0.75);
        --glow: 0 0 12px rgba(0, 255, 255, 0.65);
        --soft-glow: 0 0 28px rgba(0, 255, 255, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "Rajdhani", system-ui, sans-serif;
        color: #e6f4ff;
        background: radial-gradient(circle at top, #0a1230 0%, var(--bg-1) 55%, var(--bg-2) 100%);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .stars,
      .stars::before,
      .stars::after {
        position: absolute;
        inset: 0;
        content: "";
        background-repeat: repeat;
        animation: twinkle 6s infinite;
      }

      .stars {
        background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent),
          radial-gradient(1px 1px at 200px 80px, #a8d6ff, transparent),
          radial-gradient(1px 1px at 120px 180px, #fff, transparent),
          radial-gradient(2px 2px at 300px 140px, #d7f3ff, transparent);
        opacity: 0.55;
      }

      .stars::before {
        background-image: radial-gradient(1px 1px at 50px 90px, #ffffff, transparent),
          radial-gradient(2px 2px at 240px 160px, #c2e8ff, transparent),
          radial-gradient(1px 1px at 400px 40px, #ffffff, transparent),
          radial-gradient(2px 2px at 500px 220px, #c2e8ff, transparent);
        opacity: 0.4;
        animation-duration: 9s;
      }

      .stars::after {
        background-image: radial-gradient(1px 1px at 10px 10px, #ffffff, transparent),
          radial-gradient(2px 2px at 180px 120px, #b5e0ff, transparent),
          radial-gradient(1px 1px at 280px 200px, #ffffff, transparent),
          radial-gradient(1px 1px at 520px 70px, #b5e0ff, transparent);
        opacity: 0.3;
        animation-duration: 12s;
      }

      .nebula {
        position: absolute;
        inset: -10% -10% auto;
        height: 60vh;
        background: radial-gradient(circle at 30% 30%, rgba(0, 120, 255, 0.2), transparent 55%),
          radial-gradient(circle at 70% 40%, rgba(255, 100, 0, 0.12), transparent 50%),
          radial-gradient(circle at 50% 80%, rgba(0, 255, 200, 0.12), transparent 60%);
        filter: blur(18px);
        opacity: 0.8;
        animation: drift 18s infinite alternate ease-in-out;
      }

      .phase {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6vh 6vw;
      }

      .panel {
        background: var(--panel);
        border: 1px solid rgba(0, 255, 255, 0.2);
        border-radius: 24px;
        padding: 6vh 6vw;
        box-shadow: var(--soft-glow);
        backdrop-filter: blur(8px);
      }

      h1 {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(2.5rem, 6vw, 5.2rem);
        margin: 0 0 1rem;
        color: var(--cyan);
        text-shadow: 0 0 12px rgba(0, 255, 255, 0.8), 0 0 32px rgba(0, 255, 255, 0.6);
        letter-spacing: 0.1em;
      }

      .subtitle {
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        margin-bottom: 3rem;
        color: #e1f6ff;
      }

      .cta {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(1rem, 2vw, 1.6rem);
        padding: 1rem 2.6rem;
        border-radius: 999px;
        border: 2px solid rgba(0, 255, 255, 0.5);
        background: rgba(0, 255, 255, 0.12);
        color: #e8ffff;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(0, 255, 255, 0.7), inset 0 0 12px rgba(0, 255, 255, 0.4);
        animation: pulse 1.8s infinite;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 1.4rem 1rem;
        width: min(92vw, 1400px);
        margin: 0 auto;
        align-content: center;
      }

      .astronaut {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        animation: bob 3.5s ease-in-out infinite;
      }

      .astronaut .emoji {
        font-size: 2.4rem;
        filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.35));
        transition: transform 0.4s ease;
      }

      .astronaut .name {
        font-size: 0.95rem;
        color: #d7efff;
        letter-spacing: 0.02em;
        text-shadow: 0 0 8px rgba(0, 255, 255, 0.25);
      }

      .flight {
        animation: rise 3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }

      .thruster {
        position: absolute;
        width: 8px;
        height: 18px;
        background: linear-gradient(180deg, rgba(0, 255, 255, 0.8), transparent);
        border-radius: 50% 50% 70% 70%;
        opacity: 0;
        filter: blur(0.5px);
        animation: thruster 0.6s ease-out infinite;
      }

      .eliminated {
        animation: fall 2.2s ease-in forwards;
        opacity: 0.2;
      }

      .eliminated .emoji {
        filter: drop-shadow(0 0 12px rgba(255, 45, 45, 0.6));
      }

      .warn {
        position: absolute;
        font-size: 1.2rem;
        color: var(--danger);
        text-shadow: 0 0 10px rgba(255, 43, 43, 0.6);
        animation: warnFlash 0.8s ease-in-out 2;
      }

      .winner {
        animation: winnerRise 5s cubic-bezier(0.15, 0.9, 0.2, 1) forwards;
      }

      .winner .emoji {
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.8));
      }

      .trail {
        position: absolute;
        width: 6px;
        height: 120px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), transparent);
        border-radius: 999px;
        filter: blur(0.5px);
        opacity: 0.85;
        animation: trail 0.6s ease-out infinite;
      }

      .winner-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        text-align: center;
      }

      .winner-avatars {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .winner-card {
        width: 130px;
        height: 130px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        animation: flip 1s ease forwards;
        transform-style: preserve-3d;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      }

      .winner-names {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(1.1rem, 2.6vw, 2rem);
        color: var(--gold);
        text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
        min-height: 6rem;
      }

      .typewriter {
        overflow: hidden;
        border-right: 2px solid rgba(255, 215, 0, 0.7);
        white-space: nowrap;
        animation: typing 2.2s steps(24, end) forwards, blink 0.6s step-end infinite;
      }

      .trophy {
        font-size: 3.2rem;
        animation: bounce 1.4s ease infinite;
        text-shadow: 0 0 18px rgba(255, 215, 0, 0.8);
      }

      .replay {
        font-family: "Orbitron", sans-serif;
        padding: 0.8rem 2.2rem;
        border-radius: 999px;
        border: 2px solid rgba(255, 215, 0, 0.7);
        background: rgba(255, 215, 0, 0.18);
        color: #fff6d0;
        cursor: pointer;
        box-shadow: 0 0 16px rgba(255, 215, 0, 0.6);
      }

      .confetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes rise {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-140px);
        }
      }

      @keyframes fall {
        0% {
          transform: translateY(-140px);
          opacity: 1;
        }
        100% {
          transform: translateY(260px);
          opacity: 0;
        }
      }

      @keyframes winnerRise {
        0% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-160px);
        }
        100% {
          transform: translateY(-120vh);
        }
      }

      @keyframes thruster {
        0% {
          opacity: 0.8;
          transform: translateY(0) scaleY(1);
        }
        100% {
          opacity: 0;
          transform: translateY(16px) scaleY(1.8);
        }
      }

      @keyframes trail {
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0.1;
        }
      }

      @keyframes warnFlash {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      @keyframes flip {
        0% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }

      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @keyframes blink {
        50% {
          border-color: transparent;
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.8;
        }
      }

      @keyframes drift {
        0% {
          transform: translateX(-20px);
        }
        100% {
          transform: translateX(20px);
        }
      }

      @media (max-width: 900px) {
        .grid {
          gap: 1rem 0.8rem;
        }

        .astronaut .emoji {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="stars"></div>
      <div class="nebula"></div>
      <div id="app" class="phase"></div>
      <canvas id="confetti" class="confetti"></canvas>
    </div>

    <script>
      const PARTICIPANTS = [
        "Esmanur Da***",
        "ufuk pı***",
        "Mehmet ÖZ***",
        "Mehmet Fı***",
        "Musa KO***",
        "Sudem ho***",
        "Ahmet Do***",
        "Emirhan Sö***",
        "Müge Yı***",
        "Elif Lü***",
        "ercan gu***",
        "Kerem Bü***",
        "Yusuf Ay***",
        "Gemini Ai",
        "Hızır ÜN***",
        "Sefer KU***",
        "Eda Ub***",
        "Umut DU***",
        "ALİ UĞ***",
        "Tayfun TE***",
        "Koray ÖZ***",
        "Nisa Bo***",
        "Eren Kü***",
        "Muhammet PE***",
        "Emre Bnc",
        "Ahmet Co***",
        "Ebubekir AK***",
        "Nur Gu***",
        "Muzaffer AY***",
        "Melisa AY***",
        "Aylin AK***",
        "serdar şA***",
        "Neslihan YI***",
        "Yasir KA***",
        "Efe AS***",
        "Erva Ba***",
        "Oğuzhan KA***",
        "Aynmable",
        "ELIF KA***",
        "Mehmet MU***",
        "nazan şA***",
        "Yusuf DE***",
        "Yasir KA***",
        "Faris ZA***",
        "Muhammed ÖZ***",
        "Sever ŞA***",
        "Tarık DE***",
        "Emre YÜ***",
        "Yunus Emre TA***",
        "Emine ER***",
        "Oguzhan CA***",
        "Ömer SÜ***",
        "Wan HA***",
        "hamza ÖZ***",
        "Halil TO***",
        "Aleyna MU***",
        "Selcan",
        "Egemen AL***",
        "Salih YA***",
        "Aliye HA***",
        "Bora ko***",
        "Lalu Khairan S",
        "Adham Mnbrs",
        "Gülcan MA***",
        "Emirhan TE***",
        "Ali ER***",
        "Gizem ÖK***",
        "Dogukaan BA***"
      ];

      const WINNERS = [...Array(PARTICIPANTS.length).keys()]
  .sort(() => Math.random() - 0.5)
  .slice(0, 3);

      const app = document.getElementById("app");
      const confettiCanvas = document.getElementById("confetti");
      const ctx = confettiCanvas.getContext("2d");
      let confettiRunning = false;

      const resizeCanvas = () => {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      };

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const createLaunchScreen = () => {
        app.innerHTML = "";
        const panel = document.createElement("div");
        panel.className = "panel";
        panel.innerHTML = `
          <h1>UZAY YURUYUSU</h1>
          <div class="subtitle">Yercekimi Devrede — Hazir misiniz?</div>
          <button class="cta" id="launchBtn">🚀 YERCEKIMINI KAPAT</button>
        `;
        app.appendChild(panel);
        document.getElementById("launchBtn").addEventListener("click", startGrid);
      };

      const startGrid = () => {
        app.innerHTML = "";
        const grid = document.createElement("div");
        grid.className = "grid";
        PARTICIPANTS.forEach((name, index) => {
          const card = document.createElement("div");
          card.className = "astronaut";
          card.style.animationDelay = `${Math.random() * 2}s`;
          card.dataset.index = index;
          card.innerHTML = `
            <div class="emoji">👨‍🚀</div>
            <div class="name">${name}</div>
          `;
          grid.appendChild(card);
        });
        app.appendChild(grid);
        setTimeout(() => startAntigravity(grid), 2000);
      };

      const startAntigravity = (grid) => {
        const astronauts = Array.from(grid.children);
        astronauts.forEach((card) => {
          card.classList.add("flight");
          const thruster = document.createElement("div");
          thruster.className = "thruster";
          thruster.style.left = "50%";
          thruster.style.bottom = "-6px";
          thruster.style.transform = "translateX(-50%)";
          card.style.position = "relative";
          card.appendChild(thruster);
        });

        setTimeout(() => {
          const winnerSet = new Set(WINNERS);
          const eliminations = astronauts.filter((card) => !winnerSet.has(Number(card.dataset.index)));
          eliminations.forEach((card, idx) => {
            setTimeout(() => {
              card.classList.add("eliminated");
              const warn = document.createElement("div");
              warn.className = "warn";
              warn.textContent = "⚠️";
              warn.style.top = "-18px";
              warn.style.right = "-8px";
              card.appendChild(warn);
            }, idx * 55);
          });

          WINNERS.forEach((winnerIndex) => {
            const card = astronauts.find((item) => Number(item.dataset.index) === winnerIndex);
            if (!card) return;
            card.classList.add("winner");
            const trail = document.createElement("div");
            trail.className = "trail";
            trail.style.left = "50%";
            trail.style.top = "80%";
            trail.style.transform = "translateX(-50%)";
            card.appendChild(trail);
          });

          setTimeout(showWinners, 6000);
        }, 3000);
      };

      const showWinners = () => {
        app.innerHTML = "";
        const container = document.createElement("div");
        container.className = "winner-screen";
        const avatars = document.createElement("div");
        avatars.className = "winner-avatars";

        WINNERS.forEach(() => {
          const card = document.createElement("div");
          card.className = "winner-card";
          card.textContent = "😊";
          avatars.appendChild(card);
        });

        const names = document.createElement("div");
        names.className = "winner-names";
        const trophy = document.createElement("div");
        trophy.className = "trophy";
        trophy.textContent = "🏆";
        const replay = document.createElement("button");
        replay.className = "replay";
        replay.textContent = "TEKRAR OYNAT";
        replay.addEventListener("click", () => {
          stopConfetti();
          createLaunchScreen();
        });

        container.appendChild(avatars);
        container.appendChild(names);
        container.appendChild(trophy);
        container.appendChild(replay);
        app.appendChild(container);

        const nameLines = WINNERS.map((winnerIndex, idx) => {
          const label = `✨ KAZANAN ${idx + 1}: ${PARTICIPANTS[winnerIndex]}`;
          return label;
        });

        let current = 0;
        const showNext = () => {
          if (current >= nameLines.length) return;
          const line = document.createElement("div");
          line.className = "typewriter";
          line.textContent = nameLines[current];
          names.appendChild(line);
          current += 1;
          setTimeout(showNext, 1700);
        };

        showNext();
        startConfetti();
      };

      const startConfetti = () => {
        confettiRunning = true;
        const pieces = Array.from({ length: 160 }).map(() => ({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * confettiCanvas.height,
          size: 3 + Math.random() * 4,
          speed: 1 + Math.random() * 2,
          drift: (Math.random() - 0.5) * 0.8,
          color: Math.random() > 0.5 ? "#ffd700" : "#ffffff"
        }));

        const animate = () => {
          if (!confettiRunning) return;
          ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
          pieces.forEach((p) => {
            p.y += p.speed;
            p.x += p.drift;
            if (p.y > confettiCanvas.height) {
              p.y = -10;
              p.x = Math.random() * confettiCanvas.width;
            }
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          });
          requestAnimationFrame(animate);
        };

        animate();
      };

      const stopConfetti = () => {
        confettiRunning = false;
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      };

      createLaunchScreen();
    </script>
  </body>
</html>
